<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YITA - 이순신고 커뮤니티</title>
    <meta name="description" content="이순신고등학교 학생들을 위한 공식 커뮤니티 YITA. 학년별 게시판, 전체 공지사항, 소모임 및 자유 게시판을 이용해보세요.">
    <meta name="keywords" content="이순신고등학교, 이순신고, YITA, 고등학교 커뮤니티, 학생 커뮤니티, 학교 공지사항">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#1b3b6f">
    <meta name="google-site-verification" content="irrshfNhSg1KhneUx8VvyJ60UU4yBN3FUWi9pSOxN6M">

    <!-- Open Graph / Facebook / Kakao -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YITA">
    <meta property="og:title" content="YITA - 이순신고 커뮤니티">
    <meta property="og:description" content="이순신고등학교 학생들을 위한 공식 커뮤니티 YITA. 학년별 게시판, 전체 공지사항, 소모임 및 자유 게시판">
    <meta property="og:locale" content="ko_KR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="YITA - 이순신고 커뮤니티">
    <meta name="twitter:description" content="이순신고등학교 학생들을 위한 공식 커뮤니티 YITA.">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YITA",
      "url": "https://yita.vercel.app/",
      "description": "이순신고등학교 학생들을 위한 공식 커뮤니티",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://yita.vercel.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="nav-top">
            <div class="logo-area">
                <div class="logo-icon" aria-hidden="true"></div>
                <div>
                    <div class="logo-text">YITA</div>
                    <div class="logo-sub">이순신고 학생 커뮤니티</div>
                </div>
            </div>
            <nav class="nav-menu" aria-label="주요 메뉴">
                <a class="active" href="/">커뮤니티</a>
                <a href="/admin">관리자</a>
            </nav>
            <div class="top-actions">
                <button class="nav-auth-btn" id="profile-edit-button" type="button" hidden>프로필 편집</button>
                <button class="nav-auth-btn" id="top-login-indicator" type="button">로그인 필요</button>
            </div>
        </div>
    </header>

    <main class="main-wrapper community-layout">
        <aside class="left-sidebar">
            <section class="login-card" id="login-card">
                <div class="login-role-tabs" role="tablist" aria-label="로그인 유형">
                    <button class="role-tab active" id="role-tab-student" type="button" data-role="student">학생</button>
                    <button class="role-tab" id="role-tab-teacher" type="button" data-role="teacher">선생님</button>
                </div>
                <h2 id="login-card-title">학생 로그인</h2>
                <p id="login-card-desc">학교 이메일(@yisunsin.cnehs.kr)로 로그인 및 회원가입할 수 있습니다.</p>
                <label>
                    이메일
                    <input type="email" id="u-email" placeholder="student@yisunsin.cnehs.kr" autocomplete="email">
                </label>
                <label>
                    비밀번호
                    <input type="password" id="u-password" placeholder="비밀번호" autocomplete="current-password">
                </label>
                <label>
                    이름 (가입 시)
                    <input type="text" id="u-name" placeholder="이름" maxlength="30">
                </label>
                <label id="u-grade-label">
                    학년 (가입 시)
                    <select id="u-grade">
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </label>
                <label id="u-office-label" hidden>
                    소속 교무실 (가입 시)
                    <input type="text" id="u-office" placeholder="예: 본관 2층 1교무실" maxlength="50">
                </label>
                <button class="btn-navy-login" id="login-button" type="button">로그인</button>
                <button class="btn-sub-login" id="signup-button" type="button">회원가입</button>
            </section>

            <section class="profile-card" id="profile-card" hidden>
                <div class="profile-name" id="display-name"></div>
                <div class="profile-school" id="display-grade"></div>
                <div class="profile-role" id="display-role"></div>
                <div class="club-request">
                    <label>
                        새 소모임 이름
                        <input type="text" id="new-club-name" maxlength="30" placeholder="예: 농구 소모임">
                    </label>
                    <button id="club-request-button" type="button">소모임 개설 요청</button>
                </div>
            </section>
        </aside>

        <section class="center-content">
            <section class="main-banner">
                <strong>YITA 커뮤니티</strong>
                <span>게시판을 선택해서 글을 읽고 작성하세요.</span>
            </section>

            <section class="board-directory" id="board-directory">
                <div class="board-list-header">
                    <h2>게시판</h2>
                    <span id="board-directory-count">로그인 후 이용 가능</span>
                </div>
                <div class="board-directory-grid" id="board-directory-grid">
                    <p class="muted">로그인하면 게시판 목록이 표시됩니다.</p>
                </div>
            </section>

            <section class="board-list-panel" id="board-view" hidden>
                <div class="board-list-header">
                    <div>
                        <button class="text-button" id="back-directory-button" type="button">← 게시판 목록</button>
                        <h2 id="post-list-title">게시판</h2>
                    </div>
                    <span id="post-list-count">0개</span>
                </div>
                <div class="board-toolbar">
                    <button id="refresh-board-button" type="button">새로고침</button>
                    <button id="back-list-button" type="button">목록 보기</button>
                </div>

                <section class="write-panel" id="write-panel" hidden>
                    <div class="write-panel-header">
                        <h3 id="current-board-title">글쓰기</h3>
                        <button id="close-write-button" type="button" class="text-button">취소</button>
                    </div>
                    <input type="text" id="form-title" placeholder="제목" maxlength="80">
                    <textarea id="form-content" placeholder="내용을 입력하세요." rows="5" maxlength="2000"></textarea>
                    <div class="write-panel-bottom">
                        <label><input type="checkbox" id="form-anon"> 익명</label>
                        <button id="submit-post-button" type="button">등록</button>
                    </div>
                </section>

                <section class="detail-view-container" id="article-detail-viewer" hidden></section>
                <div id="post-list" class="post-list muted">게시판을 선택하세요.</div>
                <div class="write-action-wrap">
                    <button id="open-write-button" type="button" class="btn-navy-login">글쓰기</button>
                </div>
            </section>

            <section class="profile-edit-panel" id="profile-edit-panel" hidden>
                <div class="profile-edit-header">
                    <button id="close-profile-edit-button" type="button" class="text-button">← 돌아가기</button>
                    <h2>프로필 편집</h2>
                </div>
                <label>
                    이름
                    <input type="text" id="profile-name-input" maxlength="30">
                </label>
                <label>
                    학년
                    <select id="profile-grade-input">
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </label>
                <label>
                    현재 비밀번호
                    <input type="password" id="profile-current-password" autocomplete="current-password">
                </label>
                <label>
                    새 비밀번호
                    <input type="password" id="profile-new-password" autocomplete="new-password">
                </label>
                <div class="write-panel-bottom">
                    <button id="save-profile-button" type="button">저장</button>
                </div>
            </section>
        </section>

        <aside class="right-sidebar">
            <section class="search-box">
                <label class="sr-only" for="search-input">게시글 검색</label>
                <input type="search" id="search-input" placeholder="전체 게시글 검색">
            </section>

            <section class="right-card">
                <h2>인기 글</h2>
                <div id="right-hot-box" class="muted">로그인 후 조회할 수 있습니다.</div>
            </section>

            <section class="right-card">
                <h2>소모임</h2>
                <div id="club-board-list" class="button-list muted">승인된 소모임 없음</div>
            </section>

            <section class="right-card admin-card" id="admin-card" hidden>
                <h2>관리자 빠른 승인</h2>
                <div id="admin-club-console" class="muted">대기 중인 요청 없음</div>
            </section>
        </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js" defer></script>
</body>
</html>
