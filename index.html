<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YITA - 이순신고 커뮤니티</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="nav-top">
            <div class="logo-area">
                <div class="logo-icon" aria-hidden="true"></div>
                <div>
                    <div class="logo-text">YITA</div>
                    <div class="logo-sub">이순신고 학생 커뮤니티</div>
                </div>
            </div>
            <nav class="nav-menu" aria-label="주요 메뉴">
                <a class="active" href="/">커뮤니티</a>
                <a href="/admin">관리자</a>
            </nav>
            <button class="nav-auth-btn" id="top-login-indicator" type="button">로그인 필요</button>
        </div>
    </header>

    <main class="main-wrapper community-layout">
        <aside class="left-sidebar">
            <section class="login-card" id="login-card">
                <h2>로그인</h2>
                <p>학교 이메일로 가입한 뒤 커뮤니티를 이용할 수 있습니다.</p>
                <label>
                    이메일
                    <input type="email" id="u-email" value="student@yisunsin.cnehs.kr" autocomplete="email">
                </label>
                <label>
                    비밀번호
                    <input type="password" id="u-password" autocomplete="current-password">
                </label>
                <label>
                    이름
                    <input type="text" id="u-name" value="이순신" maxlength="30">
                </label>
                <label>
                    학년
                    <select id="u-grade">
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                    </select>
                </label>
                <button class="btn-red-login" id="login-button" type="button">로그인</button>
                <button class="btn-sub-login" id="signup-button" type="button">회원가입</button>
            </section>

            <section class="profile-card" id="profile-card" hidden>
                <div class="profile-name" id="display-name"></div>
                <div class="profile-school" id="display-grade"></div>
                <div class="profile-role" id="display-role"></div>
                <div class="club-request">
                    <label>
                        새 소모임 이름
                        <input type="text" id="new-club-name" maxlength="30" placeholder="예: 농구 소모임">
                    </label>
                    <button id="club-request-button" type="button">소모임 개설 요청</button>
                </div>
            </section>
        </aside>

        <section class="center-content">
            <section class="main-banner">
                <strong>YITA 커뮤니티</strong>
                <span>게시판을 선택해서 글을 읽고 작성하세요.</span>
            </section>

            <section class="board-directory" id="board-directory">
                <div class="board-list-header">
                    <h2>게시판</h2>
                    <span id="board-directory-count">로그인 후 이용 가능</span>
                </div>
                <div class="board-directory-grid" id="board-directory-grid">
                    <p class="muted">로그인하면 게시판 목록이 표시됩니다.</p>
                </div>
            </section>

            <section class="board-list-panel" id="board-view" hidden>
                <div class="board-list-header">
                    <div>
                        <button class="text-button" id="back-directory-button" type="button">← 게시판 목록</button>
                        <h2 id="post-list-title">게시판</h2>
                    </div>
                    <span id="post-list-count">0개</span>
                </div>
                <div class="board-toolbar">
                    <button id="refresh-board-button" type="button">새로고침</button>
                    <button id="back-list-button" type="button">목록 보기</button>
                </div>

                <section class="write-panel" id="write-panel" hidden>
                    <div class="write-panel-header">
                        <h3 id="current-board-title">글쓰기</h3>
                        <button id="close-write-button" type="button" class="text-button">취소</button>
                    </div>
                    <input type="text" id="form-title" placeholder="제목" maxlength="80">
                    <textarea id="form-content" placeholder="내용을 입력하세요." rows="5" maxlength="2000"></textarea>
                    <div class="write-panel-bottom">
                        <label><input type="checkbox" id="form-anon"> 익명</label>
                        <button id="submit-post-button" type="button">등록</button>
                    </div>
                </section>

                <section class="detail-view-container" id="article-detail-viewer" hidden></section>
                <div id="post-list" class="post-list muted">게시판을 선택하세요.</div>
                <div class="write-action-wrap">
                    <button id="open-write-button" type="button" class="btn-red-login">글쓰기</button>
                </div>
            </section>
        </section>

        <aside class="right-sidebar">
            <section class="search-box">
                <label class="sr-only" for="search-input">게시글 검색</label>
                <input type="search" id="search-input" placeholder="전체 게시글 검색">
            </section>

            <section class="right-card">
                <h2>인기 글</h2>
                <div id="right-hot-box" class="muted">로그인 후 조회할 수 있습니다.</div>
            </section>

            <section class="right-card">
                <h2>소모임</h2>
                <div id="club-board-list" class="button-list muted">승인된 소모임 없음</div>
            </section>

            <section class="right-card admin-card" id="admin-card" hidden>
                <h2>관리자 빠른 승인</h2>
                <div id="admin-club-console" class="muted">대기 중인 요청 없음</div>
            </section>
        </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js" defer></script>
</body>
</html>
